name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  pure-go:
    name: Pure Go tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests without TagLib
        run: go test ./config ./internal/beatport ./internal/validator

  taglib:
    name: TagLib-enabled tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build zlib1g-dev

      - name: Build TagLib
        run: |
          git clone --depth 1 --branch v2.3 https://github.com/taglib/taglib.git /tmp/taglib-src
          cmake -S /tmp/taglib-src -B /tmp/taglib-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/taglib-install \
            -DBUILD_SHARED_LIBS=ON
          cmake --build /tmp/taglib-build
          cmake --install /tmp/taglib-build

      - name: Run full tests
        env:
          CGO_CPPFLAGS: -I/tmp/taglib-install/include
          CGO_CFLAGS: -I/tmp/taglib-install/include
          CGO_CXXFLAGS: -I/tmp/taglib-install/include
          CGO_LDFLAGS: -L/tmp/taglib-install/lib -Wl,-rpath,/tmp/taglib-install/lib
          LD_LIBRARY_PATH: /tmp/taglib-install/lib
        run: go test ./...
