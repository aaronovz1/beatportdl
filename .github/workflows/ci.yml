name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  dockerized-tests:
    name: Dockerized tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build pinned builder image
        run: docker build -f Dockerfile.build -t beatportdl-builder:ci .

      - name: Run full test suite in container
        run: docker run --rm -v "$PWD:/workspace" beatportdl-builder:ci test

  dockerized-builds:
    name: Dockerized Linux cross-builds
    runs-on: ubuntu-latest
    needs: dockerized-tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build pinned builder image
        run: docker build -f Dockerfile.build -t beatportdl-builder:ci .

      - name: Build supported Linux release artifacts in container
        run: docker run --rm -v "$PWD:/workspace" beatportdl-builder:ci release-core

  macos-amd64-build:
    name: macOS amd64 native build
    runs-on: macos-15-intel
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install native build tools
        run: brew install cmake ninja

      - name: Build pinned macOS amd64 dependencies
        run: ./scripts/build-release-deps.sh darwin-amd64 "$RUNNER_TEMP/deps/darwin-amd64"

      - name: Build macOS amd64 artifact
        run: ./scripts/build-release-target.sh darwin-amd64 "$RUNNER_TEMP/deps/darwin-amd64"

  macos-arm64-build:
    name: macOS arm64 native build
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install native build tools
        run: brew install cmake ninja

      - name: Build pinned macOS arm64 dependencies
        run: ./scripts/build-release-deps.sh darwin-arm64 "$RUNNER_TEMP/deps/darwin-arm64"

      - name: Build macOS arm64 artifact
        run: ./scripts/build-release-target.sh darwin-arm64 "$RUNNER_TEMP/deps/darwin-arm64"

  windows-amd64-build:
    name: Windows amd64 native build
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            git
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja

      - name: Build pinned Windows dependencies
        shell: msys2 {0}
        run: ./scripts/build-release-deps.sh windows-amd64 "$RUNNER_TEMP/deps/windows-amd64"

      - name: Build Windows artifact
        shell: msys2 {0}
        run: ./scripts/build-release-target.sh windows-amd64 "$RUNNER_TEMP/deps/windows-amd64"
