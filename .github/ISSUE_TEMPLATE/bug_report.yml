name: Bug
description: Something isn't working as expected
title: "[BUG] <title>"
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: |
        Briefly describe the problem you are having.

        Include both the current behavior (what you are seeing) as well as what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Use config option X
        2. Download Y
        3. See error
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      description: |
        Operating system and architecture on which the issue was encountered
      placeholder: "Windows 11 Pro 64-bit, macOS 15.0.1 M3 Max, Ubuntu 24.04.1 LTS 64-bit"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: |
        Release version or commit hash. Use the fork release version if you are using this maintained fork.
      placeholder: "1.0.8 or commit hash"
    validations:
      required: true
  - type: dropdown
    id: store
    attributes:
      label: Store
      description: Which service were you using?
      options:
        - Beatport
        - Beatsource
        - Both
        - Not sure
    validations:
      required: true
  - type: input
    id: subscription
    attributes:
      label: Subscription tier
      description: Active streaming tier for the affected store. Do not include account identifiers.
      placeholder: "Beatport Advanced, Beatport Professional, Beatsource Pro+"
    validations:
      required: true
  - type: dropdown
    id: quality
    attributes:
      label: Configured quality
      options:
        - medium-hls
        - medium
        - high
        - lossless
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: url_type
    attributes:
      label: URL type
      options:
        - Track
        - Release
        - Playlist
        - Chart
        - Label
        - Artist
        - Search query
        - Not sure
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or config
      description: Remove usernames, passwords, tokens, cookies, account identifiers, and private local paths before posting.
      render: shell
    validations:
      required: false
  - type: textarea
    id: anything_else
    attributes:
      label: Anything else?
      description: |
        Links? References? Anything that will give us more context about the issue you are encountering!
    validations:
      required: false
